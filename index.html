<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randomattic - D&D Generators</title>
    
    <!-- Подключаем шрифты (Cinzel для заголовков, Inter для текста) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1>Randomattic</h1>
                <p>Пыльный чердак со случайными таблицами</p>
            </div>
            <button id="theme-toggle" class="theme-btn" aria-label="Переключить тему">
                <span id="theme-icon">ߌ鼯span>
            </button>
        </div>
    </header>

    <main class="dashboard">
        <!-- Контейнер для карточек. Сюда JS будет вставлять генераторы -->
        <div id="generators-grid" class="grid-container"></div>
    </main>

    <!-- Подключаем скрипты -->
    <script src="script.js"></script>
</body>
</html>
